<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
#bvGl{position:relative!important;left:50%!important;right:50%!important;margin-left:-50vw!important;margin-right:-50vw!important;width:100vw!important;max-width:100vw!important;box-sizing:border-box!important;background:#f8fafc;padding:64px 0;direction:rtl;overflow:hidden}
#bvGl *{box-sizing:border-box!important;font-family:Cairo,sans-serif!important}
.bvGl_wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.bvGl_head{text-align:center;margin-bottom:40px}
.bvGl_title{font-size:clamp(22px,3vw,36px);font-weight:900;color:#0a1628!important;margin:0 0 10px!important}
.bvGl_title span{color:#3B82F6}
.bvGl_desc{font-size:14px;color:#64748b!important;margin:0!important}

/* شريط التمرير */
.bvGl_track-outer{position:relative;overflow:hidden;margin:0 -24px}
.bvGl_track-outer::before,.bvGl_track-outer::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:10;pointer-events:none}
.bvGl_track-outer::before{right:0;background:linear-gradient(to left,#f8fafc,transparent)}
.bvGl_track-outer::after{left:0;background:linear-gradient(to right,#f8fafc,transparent)}
.bvGl_track{display:flex;gap:14px;width:max-content;animation:bvGlScroll 32s linear infinite}
.bvGl_track:hover{animation-play-state:paused}
@keyframes bvGlScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* البطاقة */
.bvGl_card{flex-shrink:0;width:180px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.08);transition:transform .35s,box-shadow .35s}
.bvGl_card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 32px rgba(0,0,0,.15)}
.bvGl_img{width:100%!important;height:240px;object-fit:cover;display:block!important;transition:transform .5s ease}
.bvGl_card:hover .bvGl_img{transform:scale(1.08)}
.bvGl_shine{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 60%);opacity:0;transition:opacity .35s;border-radius:14px}
.bvGl_card:hover .bvGl_shine{opacity:1}

/* زر */
.bvGl_ctaWrap{text-align:center;margin-top:40px}
.bvGl_ctaBtn{display:inline-flex!important;align-items:center;gap:10px;padding:12px 30px!important;background:#1D4ED8!important;border:none!important;border-radius:50px!important;font-size:14px;font-weight:800;color:#fff!important;text-decoration:none!important;box-shadow:0 6px 20px rgba(29,78,216,.3);transition:all .3s}
.bvGl_ctaBtn:hover{background:#1e40af!important;transform:translateY(-2px);box-shadow:0 10px 28px rgba(29,78,216,.45)!important;color:#fff!important}
.bvGl_ctaBtn svg{width:17px;height:17px;fill:#fff;flex-shrink:0}
</style>
