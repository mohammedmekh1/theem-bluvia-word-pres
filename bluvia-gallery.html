<div id="bvGl-wrap">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
#bvGl{position:relative!important;left:50%!important;right:50%!important;margin-left:-50vw!important;margin-right:-50vw!important;width:100vw!important;max-width:100vw!important;box-sizing:border-box!important;background:#f8fafc;padding:70px 0;direction:rtl;overflow:hidden}
#bvGl *{box-sizing:border-box!important;font-family:Cairo,sans-serif!important}
.bvGl_wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.bvGl_head{text-align:center;margin-bottom:48px}
.bvGl_tag{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2)!important;border-radius:100px;font-size:12px;font-weight:700;color:#3B82F6;letter-spacing:1px;margin-bottom:16px}
.bvGl_tag::before{content:'';width:6px;height:6px;border-radius:50%;background:#3B82F6;animation:bvGlPulse 2s ease-in-out infinite}
@keyframes bvGlPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.bvGl_title{font-size:clamp(26px,3.5vw,42px);font-weight:900;color:#0a1628!important;margin:0 0 12px!important}
.bvGl_title span{color:#3B82F6}
.bvGl_desc{font-size:15px;color:#64748b!important;max-width:520px;margin:0 auto!important;line-height:1.8}
.bvGl_grid{columns:3;column-gap:16px}
.bvGl_item{break-inside:avoid;position:relative;margin-bottom:16px;border-radius:14px;overflow:hidden;cursor:pointer;display:block}
.bvGl_item:nth-child(2){margin-top:40px}
.bvGl_item:nth-child(3){margin-top:20px}
.bvGl_item:nth-child(5){margin-top:30px}
.bvGl_item:nth-child(8){margin-top:20px}
.bvGl_img{width:100%!important;height:auto;display:block!important;transform:scale(1);transition:transform .6s cubic-bezier(.25,.46,.45,.94);object-fit:cover}
.bvGl_overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,14,31,.88) 0%,rgba(6,14,31,.4) 40%,transparent 100%);opacity:0;transition:opacity .4s ease;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px;gap:8px}
.bvGl_item:hover .bvGl_overlay{opacity:1}
.bvGl_item:hover .bvGl_img{transform:scale(1.07)}
.bvGl_name{font-size:15px;font-weight:700;color:#fff;text-align:center;transform:translateY(10px);transition:transform .4s ease}
.bvGl_item:hover .bvGl_name{transform:translateY(0)}
.bvGl_zoom{width:42px;height:42px;border-radius:50%;background:rgba(59,130,246,.2);border:1.5px solid rgba(59,130,246,.5)!important;display:flex;align-items:center;justify-content:center;transform:scale(.7) translateY(10px);opacity:0;transition:transform .4s ease .05s,opacity .4s ease .05s;position:absolute;top:50%;left:50%;translate:-50% -50%}
.bvGl_item:hover .bvGl_zoom{transform:scale(1) translateY(0);opacity:1}
.bvGl_zoom svg{width:18px;height:18px;stroke:#60A5FA;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bvGl_ctaWrap{text-align:center;margin-top:48px}
.bvGl_ctaBtn{display:inline-flex!important;align-items:center;gap:10px;padding:13px 32px!important;background:linear-gradient(135deg,#2563eb,#3B82F6)!important;border:none!important;border-radius:100px!important;font-size:14px;font-weight:800;color:#fff!important;text-decoration:none!important;box-shadow:0 8px 28px rgba(59,130,246,.3);transition:all .3s}
.bvGl_ctaBtn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(59,130,246,.45)!important;color:#fff!important}
.bvGl_ctaBtn svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
@media(max-width:900px){.bvGl_grid{columns:2}}
@media(max-width:560px){.bvGl_grid{columns:1}#bvGl{padding:50px 0}}
</style>
