@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

#bvGl {
  position:relative!important;left:50%!important;right:50%!important;
  margin-left:-50vw!important;margin-right:-50vw!important;
  width:100vw!important;max-width:100vw!important;
  box-sizing:border-box!important;
  background:#f8fafc;
  padding:64px 0;
  direction:rtl;
  overflow:hidden;
}
#bvGl * { box-sizing:border-box!important; font-family:Cairo,sans-serif!important; }

.bvGl_inner { max-width:1180px; margin:0 auto; padding:0 24px; }

.bvGl_head { text-align:center; margin-bottom:36px; }
.bvGl_title { font-size:clamp(22px,3vw,36px); font-weight:900; color:#0a1628!important; margin:0 0 8px!important; }
.bvGl_title span { color:#3B82F6; }
.bvGl_desc { font-size:14px; color:#64748b!important; margin:0!important; }

.bvGl_frame {
  border:2px solid #e2e8f0;
  border-radius:20px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.9);
  padding:18px 0;
  position:relative;
}
.bvGl_frame::before,
.bvGl_frame::after {
  content:""; position:absolute; top:0; bottom:0; width:90px; z-index:10; pointer-events:none;
}
.bvGl_frame::before { right:0; background:linear-gradient(to left,#fff 30%,transparent); }
.bvGl_frame::after  { left:0;  background:linear-gradient(to right,#fff 30%,transparent); }

.bvGl_track {
  display:flex; gap:14px; width:max-content;
  animation:bvGlScroll 42s linear infinite;
}
.bvGl_track:hover { animation-play-state:paused; }
@keyframes bvGlScroll {
  0%   { transform:translateX(0); }
  100% { transform:translateX(calc(-100% / 3)); }
}

.bvGl_card {
  flex-shrink:0; width:164px; height:218px;
  border-radius:14px; overflow:hidden;
  position:relative; cursor:pointer;
  border:1.5px solid #e2e8f0;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:transform .35s, box-shadow .35s, border-color .35s;
}
.bvGl_card::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);
  border-radius:14px; opacity:0; transition:opacity .35s; pointer-events:none;
}
.bvGl_card:hover {
  transform:scale(1.06) translateY(-4px);
  box-shadow:0 16px 36px rgba(59,130,246,.15), 0 0 0 2px rgba(59,130,246,.3);
  border-color:#93C5FD;
}
.bvGl_card:hover::after { opacity:1; }
.bvGl_img {
  width:100%!important; height:100%!important;
  object-fit:cover; display:block!important;
  transition:transform .5s ease;
}
.bvGl_card:hover .bvGl_img { transform:scale(1.08); }

.bvGl_dots {
  display:flex; align-items:center; justify-content:center;
  gap:7px; margin-top:20px;
}
.bvGl_dot {
  width:7px; height:7px; border-radius:50%;
  background:#cbd5e1; transition:background .4s, transform .4s;
}
.bvGl_dot.active { background:#3B82F6; transform:scale(1.3); }

.bvGl_cta { text-align:center; margin-top:28px; }
.bvGl_link {
  display:inline-flex!important; align-items:center!important;
  justify-content:center!important; gap:8px;
  color:#1D4ED8!important; font-size:13px; font-weight:700;
  text-decoration:none!important;
  border-bottom:1.5px solid rgba(29,78,216,.3);
  transition:color .25s, border-color .25s;
  padding-bottom:3px; line-height:1;
}
.bvGl_link:hover { color:#1e40af!important; border-color:#1D4ED8; }
.bvGl_link svg { width:15px; height:15px; fill:#1D4ED8; flex-shrink:0; display:block!important; transition:fill .25s; }
.bvGl_link span { display:block; line-height:1; }
.bvGl_link:hover svg { fill:#1e40af; }
</style>
