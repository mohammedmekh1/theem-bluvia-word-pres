<!-- [bluvia_gallery] معرض الصور -->
<div id="bvGr-wrap" dir="rtl">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');
#bvGr{position:relative!important;left:50%!important;right:50%!important;margin-left:-50vw!important;margin-right:-50vw!important;width:100vw!important;max-width:100vw!important;box-sizing:border-box!important;background:#060e1f;padding:80px 0 70px;direction:rtl;overflow:hidden}
#bvGr *{box-sizing:border-box!important;font-family:Cairo,sans-serif!important}
/* خلفية زخرفية */
.bvGr_orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;opacity:.12}
.bvGr_orb--1{width:500px;height:500px;background:radial-gradient(circle,#3B82F6 0%,transparent 70%);top:-180px;left:-100px}
.bvGr_orb--2{width:400px;height:400px;background:radial-gradient(circle,#1d4ed8 0%,transparent 70%);bottom:-120px;right:-80px}
/* الحاوية */
.bvGr_wrap{max-width:1100px;margin:0 auto;padding:0 32px}
/* الرأس */
.bvGr_head{text-align:center;margin-bottom:48px}
.bvGr_tag{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3)!important;color:#60a5fa;font-size:13px;font-weight:700;padding:6px 18px;border-radius:50px;margin-bottom:18px}
.bvGr_tag_dot{width:6px;height:6px;background:#3B82F6;border-radius:50%;box-shadow:0 0 8px #3B82F6;animation:bvGrPulse 2s ease-in-out infinite}
.bvGr_title{font-size:clamp(24px,3.5vw,40px);font-weight:800;color:#fff!important;margin:0!important;line-height:1.2}
.bvGr_title span{background:linear-gradient(135deg,#3B82F6,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* منطقة السلايدر */
.bvGr_stage{position:relative;overflow:hidden}
.bvGr_page{display:none;gap:14px;justify-content:center;align-items:stretch}
.bvGr_page.bvGr_on{display:flex;animation:bvGrFadeIn 1s ease forwards}
.bvGr_page.bvGr_out{animation:bvGrFadeOut .5s ease forwards}
/* البطاقة */
.bvGr_card{flex:0 0 auto;width:190px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.07)!important;box-shadow:0 4px 20px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.25,.46,.45,.94),box-shadow .4s,border-color .4s}
.bvGr_card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 50px rgba(59,130,246,.2),0 0 0 1px rgba(96,165,250,.3)!important;border-color:rgba(96,165,250,.35)!important}
.bvGr_img-wrap{width:100%;aspect-ratio:3/4;overflow:hidden;display:block}
.bvGr_img{width:100%!important;height:100%!important;object-fit:cover;display:block!important;transition:transform .6s ease}
.bvGr_card:hover .bvGr_img{transform:scale(1.07)}
/* بروق زجاجية خفيفة على الصورة */
.bvGr_card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 50%);pointer-events:none;border-radius:16px}
/* أزرار التنقل */
.bvGr_nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:36px}
.bvGr_arr{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)!important;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,border-color .3s,transform .2s;padding:0!important}
.bvGr_arr:hover{background:rgba(59,130,246,.2);border-color:rgba(96,165,250,.4)!important;transform:scale(1.1)}
.bvGr_arr svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.bvGr_arr:hover svg{stroke:#60a5fa}
/* النقاط */
.bvGr_dots{display:flex;align-items:center;gap:8px}
.bvGr_dot{height:2px;border-radius:2px;background:rgba(255,255,255,.15);border:none!important;padding:0!important;cursor:pointer;transition:all .4s;overflow:hidden;position:relative;width:20px}
.bvGr_dot.bvGr_dot--on{width:36px;background:rgba(96,165,250,.25)}
.bvGr_dot.bvGr_dot--on::after{content:"";position:absolute;inset:0;background:rgba(96,165,250,.85);animation:bvGrBar var(--dur,6s) linear forwards}
/* إنستغرام */
.bvGr_cta{text-align:center;margin-top:32px}
.bvGr_ig{display:inline-flex!important;align-items:center;gap:8px;color:rgba(255,255,255,.4)!important;font-size:12px;font-weight:600;text-decoration:none!important;transition:color .3s;letter-spacing:.3px}
.bvGr_ig:hover{color:#60a5fa!important}
.bvGr_ig svg{width:15px;height:15px;fill:rgba(255,255,255,.4);flex-shrink:0;transition:fill .3s}
.bvGr_ig:hover svg{fill:#60a5fa}
/* انيميشن */
@keyframes bvGrFadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes bvGrFadeOut{from{opacity:1}to{opacity:0}}
@keyframes bvGrPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes bvGrBar{from{transform:translateX(-100%)}to{transform:translateX(0)}}
/* موبايل */
@media(max-width:900px){.bvGr_card{width:150px}}
@media(max-width:600px){#bvGr{padding:60px 0 50px}.bvGr_wrap{padding:0 16px}.bvGr_card{width:120px}.bvGr_page{gap:10px}}
</style>

        <div class="bvGr_card"><div class="bvGr_img-wrap"><img class="bvGr_img" src="https://images.pexels.com/photos/1583582/pexels-photo-1583582.jpeg?auto=compress&w=400&h=533&fit=crop" alt="" loading="lazy"></div></div>
        <div class="bvGr_card"><div class="bvGr_img-wrap"><img class="bvGr_img" src="https://images.pexels.com/photos/3601425/pexels-photo-3601425.jpeg?auto=compress&w=400&h=533&fit=crop" alt="" loading="lazy"></div></div>

<script>
(function(){
  var PAGES=3,INTERVAL=6000,cur=0,busy=false,timer=null;
  var pages=[],dots=[];
  for(var i=0;i<PAGES;i++) pages.push(document.getElementById('bvGrP'+i));
  var dotWrap=document.getElementById('bvGrDots');
  for(var j=0;j<PAGES;j++){
    var d=document.createElement('button');
    d.className='bvGr_dot'+(j===0?' bvGr_dot--on':'');
    d.style.setProperty('--dur',INTERVAL+'ms');
    d.setAttribute('aria-label','صفحة '+(j+1));
    d.addEventListener('click',(function(idx){return function(){goTo(idx,true);};})(j));
    dotWrap.appendChild(d);
    dots.push(d);
  }
  function goTo(idx,manual){
    if(busy||idx===cur)return;
    busy=true;
    pages[cur].classList.remove('bvGr_on');
    dots[cur].classList.remove('bvGr_dot--on');
    cur=idx;
    pages[cur].classList.add('bvGr_on');
    dots[cur].classList.remove('bvGr_dot--on');
    dots[cur].offsetHeight;
    dots[cur].classList.add('bvGr_dot--on');
    dots[cur].style.setProperty('--dur',INTERVAL+'ms');
    setTimeout(function(){busy=false;},600);
    if(manual){clearInterval(timer);startTimer();}
  }
  function startTimer(){
    timer=setInterval(function(){if(!busy)goTo((cur+1)%PAGES,false);},INTERVAL);
  }
  document.getElementById('bvGrNext').addEventListener('click',function(){goTo((cur+PAGES-1)%PAGES,true);});
  document.getElementById('bvGrPrev').addEventListener('click',function(){goTo((cur+1)%PAGES,true);});
  startTimer();
}());
</script>
