<style>
#bvH{
  position:relative!important;left:50%!important;right:50%!important;
  margin-left:-50vw!important;margin-right:-50vw!important;
  width:100vw!important;max-width:100vw!important;
  overflow:hidden!important;box-sizing:border-box!important;
  height:92vh;min-height:480px;max-height:860px;
  background:#0a1628;direction:rtl;
}
#bvH *{box-sizing:border-box!important;font-family:Cairo,sans-serif}
/* الشرائح */
#bvSlides{position:absolute!important;inset:0!important}
.bvSlide{position:absolute!important;inset:0!important;opacity:0;z-index:1;transition:opacity 1.4s ease,transform 1.4s ease;transform:scale(1.06)}
.bvSlide.bvOn{opacity:1!important;z-index:2!important;transform:scale(1)!important}
.bvSlide img{width:100%!important;height:100%!important;object-fit:cover;display:block!important;max-width:none!important}
.bvOv{position:absolute!important;inset:0!important;background:linear-gradient(to top,rgba(6,14,31,.85) 0%,rgba(6,14,31,.35) 50%,rgba(6,14,31,.2) 100%)}
/* شريط التقدم */
.bvP{position:absolute!important;top:0!important;left:0!important;right:0!important;height:3px!important;background:rgba(255,255,255,.07)!important;z-index:40!important}
.bvPi{height:100%!important}
.bvPb{height:100%!important;background:linear-gradient(to left,#60A5FA,#3B82F6)!important;width:0%;transition:width .1s linear!important}
/* محتوى وسط */
.bvBody{position:absolute!important;inset:0!important;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:72px}
.bvBodyIn{text-align:center}
/* الأزرار */
.bvBtns{display:inline-flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.bvBtnBl{
  display:inline-flex!important;align-items:center;gap:7px;
  padding:11px 26px!important;border-radius:50px!important;
  font-size:13px;font-weight:800;letter-spacing:.2px;
  color:#fff!important;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8)!important;
  border:none!important;text-decoration:none!important;
  box-shadow:0 6px 20px rgba(59,130,246,.4);
  transition:all .3s;
}
.bvBtnBl:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 28px rgba(59,130,246,.55)!important;color:#fff!important}
.bvBtnWa{
  display:inline-flex!important;align-items:center;gap:8px;
  padding:10px 22px!important;border-radius:50px!important;
  font-size:13px;font-weight:700;
  color:#fff!important;
  background:rgba(255,255,255,.09)!important;
  border:1px solid rgba(255,255,255,.22)!important;
  text-decoration:none!important;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all .3s;
}
.bvBtnWa:hover{background:rgba(37,211,102,.18)!important;border-color:rgba(37,211,102,.5)!important;color:#fff!important}
/* نقاط التنقل */
.bvFoot{position:absolute!important;bottom:20px;left:0;right:0;z-index:30;display:flex;justify-content:center}
.bvDots{display:flex;align-items:center;gap:8px}
.bvDot{height:3px;width:18px;border-radius:3px;background:rgba(255,255,255,.2);border:none!important;padding:0!important;margin:0!important;cursor:pointer;transition:all .5s;overflow:hidden;position:relative}
.bvDot.bvDotOn{width:36px;background:rgba(59,130,246,.3)}
.bvDot.bvDotOn::after{content:"";position:absolute;inset:0;background:#3B82F6;animation:bvProg 6s linear forwards}
@keyframes bvProg{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(max-width:599px){
  #bvH{height:85vh;min-height:400px}
  .bvBtnBl,.bvBtnWa{padding:10px 18px!important;font-size:12px}
}
</style>

<script>
(function(){
  "use strict";

  var SLIDES = [
    {
      img:"https://images.unsplash.com/photo-1527838832700-5059252407fa?w=1800&q=80&fit=crop",
      alt:"إسطنبول"
    },
    {
      img:"https://images.unsplash.com/photo-1574872849676-013dc2e8d553?w=1800&q=80&fit=crop",
      alt:"كبادوكيا"
    },
    {
      img:"https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?w=1800&q=80&fit=crop",
      alt:"تونس"
    },
    {
      img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1800&q=80&fit=crop",
      alt:"شاطئ"
    },
    {
      img:"https://images.unsplash.com/photo-1599640842225-85d9cd7efa9d?w=1800&q=80&fit=crop",
      alt:"أنطاليا"
    }
  ];

  var INTERVAL_MS = 6000;
  var cur = 0, busy = false, prog = 0, progT = null, paused = false;

  var hero = document.getElementById("bvH");
  if(!hero) return;
  var sC  = document.getElementById("bvSlides");
  var dC  = document.getElementById("bvDots");
  var bar = document.getElementById("bvBar");

  /* بناء الشرائح */
  SLIDES.forEach(function(s,i){
    var sl = document.createElement("div");
    sl.className = "bvSlide" + (i===0?" bvOn":"");
    var img = document.createElement("img");
    img.src = s.img;
    img.alt = s.alt;
    img.loading = i===0?"eager":"lazy";
    var ov = document.createElement("div");
    ov.className = "bvOv";
    sl.appendChild(img);
    sl.appendChild(ov);
    sC.appendChild(sl);

    var dot = document.createElement("button");
    dot.className = "bvDot" + (i===0?" bvDotOn":"");
    dot.setAttribute("aria-label","شريحة "+(i+1));
    dot.addEventListener("click",function(){ goTo(i); });
    dC.appendChild(dot);
  });

  function getEls(){ return { s: hero.querySelectorAll(".bvSlide"), d: hero.querySelectorAll(".bvDot") }; }

  function goTo(idx){
    if(busy) return;
    var e = getEls();
    if(idx<0||idx>=e.s.length) return;
    busy = true;
    prog = 0;
    bar.style.width = "0%";
    e.s[cur].classList.remove("bvOn");
    e.d[cur].classList.remove("bvDotOn");
    cur = idx;
    e.s[cur].classList.add("bvOn");
    var dot = e.d[cur];
    dot.classList.remove("bvDotOn");
    dot.offsetHeight;
    dot.classList.add("bvDotOn");
    setTimeout(function(){ busy=false; }, 900);
  }

  function startProg(){
    clearInterval(progT);
    var step = 100/(INTERVAL_MS/75);
    progT = setInterval(function(){
      if(!paused && !busy){
        prog += step;
        bar.style.width = Math.min(prog,100)+"%";
        if(prog>=100){ prog=0; goTo((cur+1)%SLIDES.length); }
      }
    }, 75);
  }

  hero.addEventListener("mouseenter",function(){ paused=true; });
  hero.addEventListener("mouseleave",function(){ paused=false; });

  /* Swipe */
  var tx=0;
  hero.addEventListener("touchstart",function(e){ tx=e.touches[0].clientX; },{passive:true});
  hero.addEventListener("touchend",function(e){
    var d=tx-e.changedTouches[0].clientX;
    if(Math.abs(d)>50) goTo(d>0?(cur+1)%SLIDES.length:(cur-1+SLIDES.length)%SLIDES.length);
  },{passive:true});

  startProg();
}());
</script>
