    sC.innerHTML = "";
    dC.innerHTML = "";
    document.getElementById("bvCtrT").textContent = String(arr.length).padStart(2, "0");

    arr.forEach(function (s, i) {
      var sl = document.createElement("div");
      sl.className = "bvSlide" + (i === 0 ? " bvOn" : "");
      sl.innerHTML =
        '<img src="' + esc(s.img) + '" alt="' + esc(s.t) + '" loading="' + (i === 0 ? "eager" : "lazy") + '">' +
        '<div class="bvOv"></div>' +
        (s.pin ? '<span class="bvPinnedBadge">📌 مثبّت</span>' : "");
      sC.appendChild(sl);

      var dot = document.createElement("button");
      dot.className = "bvDot" + (i === 0 ? " bvDotOn" : "");
      dot.setAttribute("data-i", i);
      dot.setAttribute("aria-label", "الشريحة " + (i + 1));
      dot.addEventListener("click", function () { goTo(i); });
      dC.appendChild(dot);
    });

    goTo(0);
    startProg();
  }

  function getEls() {
    return { slides: hero.querySelectorAll(".bvSlide"), dots: hero.querySelectorAll(".bvDot") };
  }

  /* ── الانتقال إلى شريحة ── */
  function goTo(idx) {
    if (busy) return;
    var els = getEls();
    if (idx < 0 || idx >= els.slides.length) return;
    busy = true;
    prog = 0;
    bar.style.width = "0%";

    els.slides[cur].classList.remove("bvOn");
    els.dots[cur].classList.remove("bvDotOn");
    cur = idx;
    els.slides[cur].classList.add("bvOn");
    els.dots[cur].classList.add("bvDotOn");

    var sl = SLIDES[cur] || SLIDES[0];
    [tEl, dEl].forEach(function (el, j) {
      if (!el) return;
      el.style.animation = "none";
      el.offsetHeight;
      el.style.opacity = "0";
      el.style.animation = "bvUp .7s ease " + (j === 0 ? ".05s" : ".15s") + " both";
    });
    if (tEl) tEl.textContent = sl.t;
    if (dEl) dEl.textContent = sl.d;
    if (lEl) lEl.href = sl.l;
    if (cEl) cEl.textContent = String(cur + 1).padStart(2, "0");

    /* إعادة تشغيل حركة dot */
    var dotEl = els.dots[cur];
    dotEl.classList.remove("bvDotOn");
    dotEl.offsetHeight;
    dotEl.classList.add("bvDotOn");

    setTimeout(function () { busy = false; }, 900);
  }

  /* ── شريط التقدم ── */
  function startProg() {
    clearInterval(progT);
    var step = 100 / (INTERVAL_MS / 75);
    progT = setInterval(function () {
      if (!paused && !busy) {
        prog += step;
        bar.style.width = Math.min(prog, 100) + "%";
        if (prog >= 100) {
          var els = getEls();
          goTo((cur + 1) % els.slides.length);
        }
      }
    }, 75);
  }

  /* ── Hover pause (صامت) ── */
  hero.addEventListener("mouseenter", function () { paused = true; });
  hero.addEventListener("mouseleave", function () { paused = false; });

  /* ── أزرار السهم ── */
  var nb = document.getElementById("bvNext");
  var pb = document.getElementById("bvPrev");
  if (nb) nb.addEventListener("click", function () { var e = getEls(); goTo((cur + 1) % e.slides.length); });
  if (pb) pb.addEventListener("click", function () { var e = getEls(); goTo((cur - 1 + e.slides.length) % e.slides.length); });

  /* ── Swipe ── */
  var tx = 0;
  hero.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  hero.addEventListener("touchend", function (e) {
    var d = tx - e.changedTouches[0].clientX;
    if (Math.abs(d) > 50) {
      var els = getEls();
      goTo(d > 0 ? (cur + 1) % els.slides.length : (cur - 1 + els.slides.length) % els.slides.length);
    }
  }, { passive: true });

  /* ── Keyboard ── */
  document.addEventListener("keydown", function (e) {
    var els = getEls();
    if (e.key === "ArrowLeft")  goTo((cur + 1) % els.slides.length);
    if (e.key === "ArrowRight") goTo((cur - 1 + els.slides.length) % els.slides.length);
  });

  /* ═══════════════════════════════════════════════
     عرض المقالات في القسم السفلي
     ══════════════════════════════════════════════*/
  function renderGrid(posts) {
    var g = document.getElementById("bvGrid");
    if (!g) return;
    if (!posts || !posts.length) {
      g.innerHTML = '<div class="bvErr">لا توجد مقالات.</div>';
      return;
    }
    var html = "";
    posts.forEach(function (p, i) {
      var img = "";
      if (p._embedded && p._embedded["wp:featuredmedia"] && p._embedded["wp:featuredmedia"][0])
        img = p._embedded["wp:featuredmedia"][0].source_url || "";
      var cat = "";
      if (p._embedded && p._embedded["wp:term"] && p._embedded["wp:term"][0] && p._embedded["wp:term"][0][0])
        cat = esc(p._embedded["wp:term"][0][0].name);
      var dt = new Date(p.date_gmt + "Z").toLocaleDateString("ar-EG", { day: "numeric", month: "long" });
      var imgH = img
        ? '<img class="bvPImg" src="' + esc(img) + '" alt="' + esc(p.title.rendered) + '" loading="lazy">'
        : '<div class="bvPImg" style="display:flex;align-items:center;justify-content:center;color:#3B82F6;font-size:28px">✈️</div>';
      html +=
        '<a class="bvPC" href="' + esc(p.link) + '" target="_blank" rel="noopener" style="animation:bvUp .5s ease ' + (i * .08) + 's both;opacity:0">' +
          imgH +
          '<div class="bvPBody">' +
            '<div class="bvPMeta">' + (cat ? '<span class="bvPCat">' + cat + "</span>" : "") + "<span>" + dt + "</span></div>" +
            '<h3 class="bvPTtl">' + p.title.rendered + "</h3>" +
            '<span class="bvPLnk">اقرأ المقال ←</span>' +
          "</div>" +
        "</a>";
    });
    g.innerHTML = html;
  }

  /* ═══════════════════════════════════════════════
     تحويل مقال WP إلى شريحة
     ══════════════════════════════════════════════*/
  function postToSlide(p) {
    var img = "https://images.pexels.com/photos/17872545/pexels-photo-17872545.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1000&w=1800";
    if (p._embedded && p._embedded["wp:featuredmedia"] && p._embedded["wp:featuredmedia"][0])
      img = p._embedded["wp:featuredmedia"][0].source_url || img;
    var tmp = document.createElement("div");
    tmp.innerHTML = p.excerpt ? p.excerpt.rendered || "" : "";
    return { t: p.title.rendered, d: tmp.textContent || "استكشف أحدث عروض بلوفيا ترافيل", l: p.link, img: img, pin: false };
  }

  /* ═══════════════════════════════════════════════
     جلب البيانات من WordPress
     ══════════════════════════════════════════════*/
  var BASE = "https://blueviatravel.com";
  var SLIDER_FETCHED = WP_POSTS_IN_SLIDER > 0
    ? WP_POSTS_IN_SLIDER
    : 0;
  /* نطلب ما يكفي للشريط + الشبكة معاً في طلب واحد */
  var FETCH_COUNT = Math.max(WP_POSTS_GRID, SLIDER_FETCHED);

  function init() {
    /* عرض الصور الثابتة فوراً إذا وُجدت */
    if (SLIDES.length) buildDOM(SLIDES);

    if (FETCH_COUNT === 0) return; /* لا حاجة للجلب */

    fetch(BASE + "/wp-json/wp/v2/posts?per_page=" + FETCH_COUNT + "&_embed=1")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.length) return;

        /* ── قسم المقالات السفلي ── */
        renderGrid(data.slice(0, WP_POSTS_GRID));

        /* ── دمج الشرائح الثابتة + شرائح WP ── */
        if (SLIDER_FETCHED > 0) {
          var wpSlides = data.slice(0, SLIDER_FETCHED).map(postToSlide);
          /* الصور الثابتة أولاً ثم WP */
          SLIDES = PINNED_SLIDES.slice(0, 10).concat(wpSlides).slice(0, 20);
          buildDOM(SLIDES);
        }
      })
      .catch(function () {
        /* الاحتياط: اعرض الثابتة وحاول الشبكة مرة ثانية */
        if (!SLIDES.length) buildDOM([
          { t: "عروض بلوفيا ترافيل", d: "استكشف أحدث رحلاتنا إلى تركيا وتونس", l: BASE + "/itineraries", img: "https://images.pexels.com/photos/17872545/pexels-photo-17872545.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1000&w=1800", pin: false }
        ]);
        /* إعادة المحاولة للشبكة (grid فقط) */
        setTimeout(function () {
          fetch(BASE + "/wp-json/wp/v2/posts?per_page=" + WP_POSTS_GRID + "&_embed=1")
            .then(function (r) { return r.json(); })
            .then(renderGrid)
            .catch(function () {});
        }, 3000);
      });
  }

  init();
}());
</script>
