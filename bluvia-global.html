<!-- [bluvia_global] تأثيرات عامة: كيرسور مخصص + شريط تقدم التمرير + Scroll Reveal -->

<!-- عناصر الكيرسور المخصص -->
<div class="bvGl_cursor" id="bvGl_cursor" aria-hidden="true"></div>
<div class="bvGl_cursorRing" id="bvGl_cursorRing" aria-hidden="true"></div>

<!-- شريط تقدم التمرير -->
<div class="bvGl_progressBar" id="bvGl_progressBar" role="progressbar" aria-hidden="true"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap');

*,*::before,*::after{box-sizing:border-box}
html{direction:rtl;scroll-behavior:smooth}
body{font-family:'Cairo','Segoe UI',Tahoma,Geneva,sans-serif;direction:rtl;margin:0;padding:0}
h1,h2,h3,h4,h5,h6,p,a,span,li,td,th,button,input,textarea,select,label,blockquote,figcaption,caption{font-family:'Cairo','Segoe UI',Tahoma,sans-serif}

/* ── Scroll Reveal ── */
.bvReveal{opacity:0;transform:translateY(30px);transition:opacity .65s cubic-bezier(.25,.46,.45,.94),transform .65s cubic-bezier(.25,.46,.45,.94);will-change:opacity,transform}
.bvReveal.bvReveal--visible{opacity:1;transform:translateY(0)}
.bvReveal:nth-child(1){transition-delay:0ms}
.bvReveal:nth-child(2){transition-delay:80ms}
.bvReveal:nth-child(3){transition-delay:160ms}
.bvReveal:nth-child(4){transition-delay:240ms}
.bvReveal:nth-child(5){transition-delay:320ms}
.bvReveal:nth-child(6){transition-delay:400ms}

/* ── كيرسور مخصص ── */
.bvGl_cursor{position:fixed;top:0;left:0;width:10px;height:10px;background:#3B82F6;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .2s ease,height .2s ease,background .2s ease,opacity .2s ease;will-change:transform;mix-blend-mode:screen}
.bvGl_cursorRing{position:fixed;top:0;left:0;width:36px;height:36px;border:1.5px solid rgba(59,130,246,.55);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .25s ease,height .25s ease,border-color .25s ease,opacity .2s ease;will-change:transform}
body.bvGl_cursorHover .bvGl_cursor{width:16px;height:16px;background:#60a5fa}
body.bvGl_cursorHover .bvGl_cursorRing{width:52px;height:52px;border-color:rgba(59,130,246,.8)}
@media(max-width:768px){.bvGl_cursor,.bvGl_cursorRing{display:none!important}body{cursor:auto}}

/* ── شريط التقدم ── */
.bvGl_progressBar{position:fixed;top:0;right:0;left:auto;width:0%;height:3px;background:linear-gradient(to left,#93c5fd,#3B82F6,#2563eb);z-index:9999;border-radius:0 0 0 3px;box-shadow:0 0 8px rgba(59,130,246,.6),0 0 20px rgba(59,130,246,.3);transition:width .05s linear;transform-origin:right center}
.bvGl_progressBar::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#60a5fa;box-shadow:0 0 10px #3B82F6,0 0 20px rgba(59,130,246,.8)}
</style>

<script>
(function(){
  'use strict';

  /* Scroll Reveal */
  var revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('bvReveal--visible');
        revealObserver.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:'0px 0px -40px 0px'});

  function initReveal(){
    document.querySelectorAll('.bvReveal').forEach(function(el){ revealObserver.observe(el); });
  }
  document.addEventListener('DOMContentLoaded', initReveal);
  window.bvRevealInit = initReveal;

  /* كيرسور مخصص */
  if(!window.matchMedia('(max-width:768px)').matches){
    var cursor=document.getElementById('bvGl_cursor');
    var ring=document.getElementById('bvGl_cursorRing');
    var mx=-100,my=-100,rx=-100,ry=-100,LAG=.12;

    document.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; });
    document.addEventListener('mouseleave',function(){ cursor.style.opacity='0'; ring.style.opacity='0'; });
    document.addEventListener('mouseenter',function(){ cursor.style.opacity='1'; ring.style.opacity='1'; });

    var hoverSel='a,button,[role="button"],input,textarea,select,label';
    document.addEventListener('mouseover',function(e){ if(e.target.closest(hoverSel)) document.body.classList.add('bvGl_cursorHover'); });
    document.addEventListener('mouseout',function(e){ if(e.target.closest(hoverSel)) document.body.classList.remove('bvGl_cursorHover'); });

    (function loop(){
      cursor.style.transform='translate('+(mx-5)+'px,'+(my-5)+'px)';
      rx+=(mx-rx)*LAG; ry+=(my-ry)*LAG;
      ring.style.transform='translate('+(rx-18)+'px,'+(ry-18)+'px)';
      requestAnimationFrame(loop);
    }());
  }

  /* شريط التقدم */
  var bar=document.getElementById('bvGl_progressBar');
  function updateProgress(){
    var st=window.pageYOffset||document.documentElement.scrollTop;
    var dh=document.documentElement.scrollHeight-document.documentElement.clientHeight;
    bar.style.width=(dh>0?(st/dh*100):0).toFixed(2)+'%';
  }
  window.addEventListener('scroll',updateProgress,{passive:true});
  window.addEventListener('resize',updateProgress,{passive:true});
  updateProgress();
}());
</script>
