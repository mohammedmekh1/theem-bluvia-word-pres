<!-- [bluvia_global] تأثيرات عامة: مؤشر مخصص + شريط تقدم التمرير + scroll reveal -->
<div id="bvGl-wrap">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');
#bvGl-wrap *{font-family:Cairo,sans-serif!important}
.bvReveal{opacity:0;transform:translateY(30px);transition:opacity .65s cubic-bezier(.25,.46,.45,.94),transform .65s cubic-bezier(.25,.46,.45,.94);will-change:opacity,transform}
.bvReveal.bvReveal--visible{opacity:1;transform:translateY(0)}
.bvReveal:nth-child(1){transition-delay:0ms}
.bvReveal:nth-child(2){transition-delay:80ms}
.bvReveal:nth-child(3){transition-delay:160ms}
.bvReveal:nth-child(4){transition-delay:240ms}
.bvReveal:nth-child(5){transition-delay:320ms}
.bvReveal:nth-child(6){transition-delay:400ms}
.bvGl_cursor{position:fixed;top:0;left:0;width:10px;height:10px;background:#3B82F6;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s,opacity .2s;will-change:transform;mix-blend-mode:screen}
.bvGl_ring{position:fixed;top:0;left:0;width:36px;height:36px;border:1.5px solid rgba(59,130,246,.55);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s,opacity .2s;will-change:transform}
body.bvGl_hover .bvGl_cursor{width:16px;height:16px;background:#60a5fa}
body.bvGl_hover .bvGl_ring{width:52px;height:52px;border-color:rgba(59,130,246,.8)}
@media(max-width:768px){.bvGl_cursor,.bvGl_ring{display:none!important}}
.bvGl_bar{position:fixed;top:0;right:0;left:auto;width:0%;height:3px;background:linear-gradient(to left,#93c5fd,#3B82F6,#2563eb);z-index:9999;border-radius:0 0 0 3px;box-shadow:0 0 8px rgba(59,130,246,.6),0 0 20px rgba(59,130,246,.3);transition:width .05s linear;transform-origin:right center}
.bvGl_bar::after{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#60a5fa;box-shadow:0 0 10px #3B82F6,0 0 20px rgba(59,130,246,.8)}
</style>

<div class="bvGl_cursor" id="bvGlCursor" aria-hidden="true"></div>
<div class="bvGl_ring" id="bvGlRing" aria-hidden="true"></div>
<div class="bvGl_bar" id="bvGlBar" role="progressbar" aria-hidden="true"></div>

<script>
(function(){
  'use strict';
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('bvReveal--visible');io.unobserve(e.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  function initReveal(){document.querySelectorAll('.bvReveal').forEach(function(el){io.observe(el);});}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initReveal);}else{initReveal();}
  window.bvRevealInit=initReveal;
  var mob=window.matchMedia('(max-width:768px)');
  if(!mob.matches){
    var cur=document.getElementById('bvGlCursor'),ring=document.getElementById('bvGlRing');
    var mx=-100,my=-100,rx=-100,ry=-100,LAG=.12;
    document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
    document.addEventListener('mouseleave',function(){cur.style.opacity='0';ring.style.opacity='0';});
    document.addEventListener('mouseenter',function(){cur.style.opacity='1';ring.style.opacity='1';});
    var hov='a,button,[role="button"],input,textarea,select,label';
    document.addEventListener('mouseover',function(e){if(e.target.closest(hov))document.body.classList.add('bvGl_hover');});
    document.addEventListener('mouseout',function(e){if(e.target.closest(hov))document.body.classList.remove('bvGl_hover');});
    (function tick(){
      cur.style.transform='translate('+(mx-5)+'px,'+(my-5)+'px)';
      rx+=(mx-rx)*LAG;ry+=(my-ry)*LAG;
      ring.style.transform='translate('+(rx-18)+'px,'+(ry-18)+'px)';
      requestAnimationFrame(tick);
    }());
  }
  var bar=document.getElementById('bvGlBar');
  function upBar(){var s=window.pageYOffset,h=document.documentElement.scrollHeight-document.documentElement.clientHeight;bar.style.width=(h>0?(s/h*100):0).toFixed(2)+'%';}
  window.addEventListener('scroll',upBar,{passive:true});
  window.addEventListener('resize',upBar,{passive:true});
  upBar();
}());
</script>
</div>
