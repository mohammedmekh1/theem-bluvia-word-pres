<!-- [bluvia_exit_intent] نافذة نية الخروج -->
<div id="bvEx" dir="rtl" role="dialog" aria-modal="true" aria-label="عرض خاص قبل المغادرة" hidden>
  <div class="bvEx_backdrop" onclick="bvExClose()"></div>
  <div class="bvEx_modal">
    <button class="bvEx_x" onclick="bvExClose()" aria-label="إغلاق">✕</button>

    <div class="bvEx_top">
      <div class="bvEx_emoji">✈️</div>
      <span class="bvEx_tag">قبل أن تغادر</span>
      <h2 class="bvEx_title">خذ عرضك الخاص معك!</h2>
      <p class="bvEx_sub">سجّل رقمك وسنرسل لك أفضل عروضنا على واتساب مباشرة</p>
    </div>

    <div class="bvEx_offers">
      <div class="bvEx_offer">🇹🇷 إسطنبول — خصم حتى 20%</div>
      <div class="bvEx_offer">🇹🇳 تونس — باقات عائلية مميزة</div>
      <div class="bvEx_offer">🎁 هدية ترحيبية مع كل حجز</div>
    </div>

    <form class="bvEx_form" onsubmit="bvExSubmit(event)">
      <input class="bvEx_input" type="tel" id="bvExPhone" placeholder="رقم الواتساب (مثال: 966501234567)" dir="ltr" required>
      <button class="bvEx_btn" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.123 1.533 5.851L.057 23.571A.75.75 0 0 0 .75 24.5l6.01-1.574A11.93 11.93 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.713 9.713 0 0 1-4.964-1.363l-.356-.212-3.693.966.987-3.607-.232-.372A9.719 9.719 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
        أرسل لي العروض
      </button>
    </form>

    <button class="bvEx_skip" onclick="bvExClose()">لا شكراً، سأتصفح لاحقاً</button>
  </div>
</div>

<style>
#bvEx{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl}
#bvEx[hidden]{display:none!important}
#bvEx.bvEx--in .bvEx_modal{animation:bvExPop .4s cubic-bezier(.34,1.56,.64,1) both}
.bvEx_backdrop{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
.bvEx_modal{
  position:relative;z-index:1;
  background:linear-gradient(160deg,#0d1a2e,#0a1628);
  border:1px solid rgba(59,130,246,.25);
  border-radius:24px;padding:40px 36px;
  max-width:460px;width:100%;text-align:center;
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
}
.bvEx_x{
  position:absolute;top:16px;left:16px;
  background:rgba(255,255,255,.08);border:none;
  color:rgba(255,255,255,.6);font-size:16px;
  width:32px;height:32px;border-radius:50%;
  cursor:pointer;line-height:1;transition:all .2s;
}
.bvEx_x:hover{background:rgba(255,255,255,.15);color:#fff}
.bvEx_emoji{font-size:48px;margin-bottom:12px;animation:bvExPlane 2s ease infinite alternate}
.bvEx_tag{
  display:inline-block;padding:4px 14px;border-radius:50px;
  background:rgba(59,130,246,.15);color:#60A5FA;
  border:1px solid rgba(59,130,246,.3);font-size:11px;font-weight:700;
  margin-bottom:14px;font-family:Cairo,sans-serif;
}
.bvEx_title{font-size:clamp(20px,4vw,26px);font-weight:900;color:#fff;margin:0 0 10px;font-family:Cairo,sans-serif}
.bvEx_sub{font-size:14px;color:rgba(255,255,255,.55);margin:0 0 24px;font-family:Cairo,sans-serif;line-height:1.6}
.bvEx_offers{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;text-align:right}
.bvEx_offer{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:10px 14px;
  font-size:13px;color:rgba(255,255,255,.7);font-family:Cairo,sans-serif;font-weight:600;
}
.bvEx_form{display:flex;flex-direction:column;gap:12px}
.bvEx_input{
  width:100%;padding:14px 16px;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:14px;font-family:Cairo,sans-serif;
  outline:none;transition:border-color .2s;text-align:center;
}
.bvEx_input:focus{border-color:rgba(59,130,246,.5);background:rgba(255,255,255,.1)}
.bvEx_input::placeholder{color:rgba(255,255,255,.3)}
.bvEx_btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#25D366,#128C5E);
  color:#fff;font-size:15px;font-weight:800;font-family:Cairo,sans-serif;
  box-shadow:0 8px 24px rgba(37,211,102,.3);transition:all .3s;
}
.bvEx_btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,211,102,.45)}
.bvEx_skip{
  margin-top:16px;background:none;border:none;
  color:rgba(255,255,255,.3);font-size:12px;cursor:pointer;
  font-family:Cairo,sans-serif;transition:color .2s;
}
.bvEx_skip:hover{color:rgba(255,255,255,.6)}
@keyframes bvExPop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes bvExPlane{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-6px) rotate(5deg)}}
@media(max-width:480px){.bvEx_modal{padding:28px 20px;border-radius:18px}}
</style>

<script>
(function(){
  var KEY='bvExShown';
  if(sessionStorage.getItem(KEY)) return;

  var shown=false;
  function show(){
    if(shown) return;
    shown=true;
    sessionStorage.setItem(KEY,'1');
    var el=document.getElementById('bvEx');
    el.removeAttribute('hidden');
    requestAnimationFrame(function(){ el.classList.add('bvEx--in'); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') bvExClose(); },{once:true});
  }

  /* Desktop: mouse leaves viewport upward */
  document.addEventListener('mouseleave',function(e){
    if(e.clientY<=0) show();
  });

  /* Mobile: scroll up significantly after scrolling down */
  var lastY=0, downTotal=0;
  window.addEventListener('scroll',function(){
    var y=window.scrollY;
    if(y>lastY) downTotal+=y-lastY;
    else if(downTotal>300 && lastY-y>80) show();
    lastY=y;
  },{passive:true});

  /* Fallback: show after 45s */
  setTimeout(show, 45000);
}());

function bvExClose(){
  var el=document.getElementById('bvEx');
  el.classList.remove('bvEx--in');
  setTimeout(function(){ el.setAttribute('hidden',''); },200);
}

function bvExSubmit(e){
  e.preventDefault();
  var phone=document.getElementById('bvExPhone').value.replace(/\D/g,'');
  var url='https://wa.me/905068668849?text='+encodeURIComponent('مرحباً، أريد الاستفسار عن العروض الخاصة');
  window.open(url,'_blank','noopener');
  bvExClose();
}
</script>
