<!-- [bluvia_countdown] عداد تنازلي للعروض -->
<section id="bvCd" dir="rtl">
  <div class="bvCd_wrap">
    <div class="bvCd_right">
      <span class="bvCd_fire">🔥</span>
      <div>
        <div class="bvCd_label">عرض محدود — ينتهي قريباً</div>
        <div class="bvCd_title" id="bvCdTitle">خصم 20% على رحلات إسطنبول الصيفية</div>
      </div>
    </div>
    <div class="bvCd_center">
      <div class="bvCd_unit">
        <div class="bvCd_num" id="bvCdD">00</div>
        <div class="bvCd_lbl">يوم</div>
      </div>
      <div class="bvCd_sep">:</div>
      <div class="bvCd_unit">
        <div class="bvCd_num" id="bvCdH">00</div>
        <div class="bvCd_lbl">ساعة</div>
      </div>
      <div class="bvCd_sep">:</div>
      <div class="bvCd_unit">
        <div class="bvCd_num" id="bvCdM">00</div>
        <div class="bvCd_lbl">دقيقة</div>
      </div>
      <div class="bvCd_sep">:</div>
      <div class="bvCd_unit">
        <div class="bvCd_num" id="bvCdS">00</div>
        <div class="bvCd_lbl">ثانية</div>
      </div>
    </div>
    <div class="bvCd_left">
      <a class="bvCd_btn" href="https://wa.me/966555888555?text=%D8%A3%D8%B1%D9%8A%D8%AF+%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1+%D8%B9%D9%86+%D8%A7%D9%84%D8%B9%D8%B1%D9%88%D8%B6" target="_blank" rel="noopener">
        احجز بالخصم
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </a>
    </div>
  </div>
</section>

<style>
#bvCd{
  position:relative!important;left:50%!important;right:50%!important;
  margin-left:-50vw!important;margin-right:-50vw!important;
  width:100vw!important;max-width:100vw!important;
  box-sizing:border-box!important;
  background:linear-gradient(135deg,#0a1628 0%,#1a2a4a 50%,#0a1628 100%);
  border-top:1px solid rgba(59,130,246,.2);
  border-bottom:1px solid rgba(59,130,246,.2);
  padding:22px 0;direction:rtl;overflow:hidden;
}
#bvCd::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.06),transparent);
  animation:bvCdShine 4s ease infinite;
}
#bvCd *{box-sizing:border-box!important}
.bvCd_wrap{
  max-width:1280px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
}
/* يمين: نص العرض */
.bvCd_right{display:flex;align-items:center;gap:14px;flex:1;min-width:200px}
.bvCd_fire{font-size:28px;animation:bvCdBounce 1s ease infinite alternate}
.bvCd_label{font-size:11px;font-weight:700;color:var(--bv-primary-light,#60A5FA);letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase}
.bvCd_title{font-size:15px;font-weight:800;color:#fff;font-family:Cairo,sans-serif}
/* وسط: الأرقام */
.bvCd_center{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bvCd_unit{text-align:center;min-width:58px}
.bvCd_num{
  font-size:32px;font-weight:900;color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:6px 10px;
  font-family:Cairo,sans-serif;line-height:1;
  min-width:58px;display:block;
  transition:transform .15s;
}
.bvCd_num.flip{transform:scale(1.08)}
.bvCd_lbl{font-size:10px;color:rgba(255,255,255,.45);margin-top:5px;font-weight:600}
.bvCd_sep{font-size:28px;font-weight:900;color:var(--bv-primary-light,#60A5FA);margin-bottom:14px;line-height:1}
/* يسار: زر */
.bvCd_left{flex-shrink:0}
.bvCd_btn{
  display:inline-flex!important;align-items:center;gap:8px;
  padding:12px 28px!important;border-radius:50px!important;
  background:linear-gradient(135deg,var(--bv-primary,#3B82F6),var(--bv-primary-dark,#1D4ED8))!important;
  color:#fff!important;font-size:14px;font-weight:800;
  text-decoration:none!important;
  box-shadow:0 6px 20px rgba(59,130,246,.4);
  transition:all .3s;font-family:Cairo,sans-serif;
  animation:bvCdPulseBtn 2.5s ease infinite;
}
.bvCd_btn:hover{transform:translateY(-2px) scale(1.04);color:#fff!important;box-shadow:0 10px 28px rgba(59,130,246,.55)!important}
@keyframes bvCdShine{0%,100%{opacity:0}50%{opacity:1}}
@keyframes bvCdBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-4px) rotate(5deg)}}
@keyframes bvCdPulseBtn{0%,100%{box-shadow:0 6px 20px rgba(59,130,246,.4)}50%{box-shadow:0 6px 28px rgba(59,130,246,.7)}}
@media(max-width:900px){.bvCd_wrap{justify-content:center;text-align:center}.bvCd_right{justify-content:center;flex-basis:100%}.bvCd_left{flex-basis:100%;text-align:center}}
@media(max-width:480px){.bvCd_num{font-size:24px;min-width:44px}.bvCd_sep{font-size:20px}}
</style>

<script>
(function(){
  /* ════════════════════════════════════════════════
     ⚙️  غيّر هذا التاريخ لتاريخ انتهاء العرض
     ════════════════════════════════════════════════ */
  var END_DATE = "2025-08-31T23:59:59";

  var dEl=document.getElementById("bvCdD");
  var hEl=document.getElementById("bvCdH");
  var mEl=document.getElementById("bvCdM");
  var sEl=document.getElementById("bvCdS");
  if(!dEl) return;

  function pad(n){return String(Math.max(0,n)).padStart(2,"0");}
  function flip(el,val){
    var cur=el.textContent;
    if(cur===val) return;
    el.classList.add("flip");
    setTimeout(function(){el.textContent=val;el.classList.remove("flip");},75);
  }

  function tick(){
    var now=new Date(), end=new Date(END_DATE);
    var diff=Math.max(0, end-now);
    var d=Math.floor(diff/864e5);
    var h=Math.floor((diff%864e5)/36e5);
    var m=Math.floor((diff%36e5)/6e4);
    var s=Math.floor((diff%6e4)/1e3);
    flip(dEl,pad(d)); flip(hEl,pad(h)); flip(mEl,pad(m)); flip(sEl,pad(s));
    if(diff===0){
      document.getElementById("bvCdTitle").textContent="انتهى العرض — تابعونا للعروض القادمة";
      clearInterval(timer);
    }
  }
  tick();
  var timer=setInterval(tick,1000);
}());
</script>
