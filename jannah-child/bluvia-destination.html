<!-- [bluvia_destination] صفحة وجهة مخصصة — يقرأ ?dest=istanbul من URL -->
<section id="bvDest" dir="rtl">
<div class="bvDest_wrap" id="bvDestWrap">

  <!-- حالة تحميل -->
  <div class="bvDest_loading" id="bvDestLoad">
    <div class="bvDest_spinner"></div>
    <p>جاري تحميل الوجهة…</p>
  </div>

  <!-- المحتوى الفعلي (مخفي حتى التحميل) -->
  <div id="bvDestContent" hidden>

    <!-- هيرو الوجهة -->
    <div class="bvDest_hero" id="bvDestHero">
      <div class="bvDest_heroOv"></div>
      <div class="bvDest_heroBody">
        <span class="bvDest_flag" id="bvDestFlag"></span>
        <h1 class="bvDest_name" id="bvDestName"></h1>
        <p class="bvDest_country" id="bvDestCountry"></p>
        <div class="bvDest_heroMeta" id="bvDestHeroMeta"></div>
      </div>
    </div>

    <!-- التفاصيل -->
    <div class="bvDest_body">

      <!-- برنامج الرحلة -->
      <div class="bvDest_section">
        <h2 class="bvDest_sTitle">📅 البرنامج اليومي</h2>
        <div class="bvDest_timeline" id="bvDestTimeline"></div>
      </div>

      <!-- ما يشمله -->
      <div class="bvDest_section">
        <h2 class="bvDest_sTitle">✅ ما تشمله الباقة</h2>
        <ul class="bvDest_includes" id="bvDestIncludes"></ul>
      </div>

      <!-- أبرز الأماكن -->
      <div class="bvDest_section">
        <h2 class="bvDest_sTitle">📍 أبرز الأماكن</h2>
        <div class="bvDest_places" id="bvDestPlaces"></div>
      </div>

      <!-- السعر + الحجز -->
      <div class="bvDest_cta" id="bvDestCta"></div>

    </div>
  </div>

  <!-- وجهة غير موجودة -->
  <div id="bvDestNotFound" hidden class="bvDest_404">
    <div class="bvDest_404icon">🗺️</div>
    <h2>الوجهة غير متوفرة</h2>

</section>

<style>
#bvDest{direction:rtl;font-family:Cairo,sans-serif;background:#060e1f;min-height:60vh}
#bvDest *{box-sizing:border-box}
.bvDest_wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

/* Loading */
.bvDest_loading{text-align:center;padding:80px 20px;color:rgba(255,255,255,.5)}
.bvDest_spinner{width:40px;height:40px;border:3px solid rgba(59,130,246,.2);border-top-color:#3B82F6;border-radius:50%;animation:bvDestSpin 1s linear infinite;margin:0 auto 16px}
@keyframes bvDestSpin{to{transform:rotate(360deg)}}

/* Hero */
.bvDest_hero{
  position:relative;height:clamp(240px,40vw,420px);border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,#0a1628,#1a2a4a);
  margin-bottom:0;display:flex;align-items:flex-end;
}
.bvDest_heroOv{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,14,31,.9) 0%,rgba(6,14,31,.3) 60%,transparent 100%)}
.bvDest_heroBody{position:relative;z-index:1;padding:28px 32px;width:100%}
.bvDest_flag{font-size:36px;display:block;margin-bottom:8px}
.bvDest_name{font-size:clamp(26px,4vw,42px);font-weight:900;color:#fff;margin:0 0 4px}
.bvDest_country{font-size:14px;color:rgba(255,255,255,.5);margin:0 0 12px}
.bvDest_heroMeta{display:flex;flex-wrap:wrap;gap:10px}
.bvDest_meta{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  border-radius:50px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,.8);font-weight:600;
}

/* Body */
.bvDest_body{padding:36px 0 0}
.bvDest_section{margin-bottom:44px}
.bvDest_sTitle{font-size:18px;font-weight:800;color:#fff;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)}

/* Timeline */
.bvDest_timeline{display:flex;flex-direction:column;gap:0}
.bvDest_day{
  display:grid;grid-template-columns:64px 1fr;gap:0;
  position:relative;
}
.bvDest_day:not(:last-child) .bvDest_dayLine{border-left:2px dashed rgba(59,130,246,.25)}
.bvDest_dayNum{
  display:flex;flex-direction:column;align-items:center;gap:0;
  padding-top:4px;
}
.bvDest_dayBadge{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  color:#fff;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bvDest_dayLine{flex:1;width:2px;margin:6px auto 0}
.bvDest_dayContent{padding:0 0 28px 0}
.bvDest_dayTitle{font-size:14px;font-weight:800;color:#fff;margin:0 0 6px;padding-top:7px}
.bvDest_dayDesc{font-size:13px;color:rgba(255,255,255,.5);margin:0;line-height:1.6}

/* Includes */
.bvDest_includes{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bvDest_includes li{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:10px 14px;
  font-size:13px;color:rgba(255,255,255,.7);font-weight:600;
}
.bvDest_incIcon{font-size:16px;flex-shrink:0}

/* Places */
.bvDest_places{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bvDest_place{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:16px;text-align:center;
  transition:transform .25s,border-color .25s;
}
.bvDest_place:hover{transform:translateY(-4px);border-color:rgba(59,130,246,.3)}
.bvDest_placeIcon{font-size:28px;margin-bottom:8px;display:block}
.bvDest_placeName{font-size:13px;font-weight:700;color:#fff}

/* CTA */
.bvDest_cta{
  background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(29,78,216,.12));
  border:1px solid rgba(59,130,246,.2);
  border-radius:20px;padding:32px;text-align:center;
}
.bvDest_ctaPrice{font-size:13px;color:rgba(255,255,255,.5);margin:0 0 6px}
.bvDest_ctaNum{font-size:clamp(32px,5vw,48px);font-weight:900;color:#fff;margin:0 0 4px}
.bvDest_ctaSub{font-size:12px;color:rgba(255,255,255,.4);margin:0 0 24px}
.bvDest_ctaBtn{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 40px;border-radius:50px;
  background:linear-gradient(135deg,#25D366,#128C5E);
  color:#fff!important;font-size:16px;font-weight:800;
  text-decoration:none!important;
  box-shadow:0 8px 28px rgba(37,211,102,.3);
  transition:all .3s;font-family:Cairo,sans-serif;
}
.bvDest_ctaBtn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(37,211,102,.45)!important;color:#fff!important}

/* 404 */
.bvDest_404{text-align:center;padding:80px 20px;color:rgba(255,255,255,.5)}
.bvDest_404icon{font-size:64px;margin-bottom:16px}
.bvDest_404 h2{color:#fff;font-size:22px;margin:0 0 10px}
.bvDest_404 a{color:#60A5FA}

@media(max-width:700px){
  .bvDest_includes{grid-template-columns:1fr}
  .bvDest_places{grid-template-columns:repeat(2,1fr)}
  .bvDest_heroBody{padding:20px}
}
@media(max-width:440px){
  .bvDest_places{grid-template-columns:1fr 1fr}
  .bvDest_day{grid-template-columns:48px 1fr}
}
</style>

  function build(d){
    /* Hero bg */
    var hero=document.getElementById('bvDestHero');
    if(d.bg) hero.style.backgroundImage='url('+d.bg+')';
    hero.style.backgroundSize='cover';
    hero.style.backgroundPosition='center';

    document.getElementById('bvDestFlag').textContent=d.flag;
    document.getElementById('bvDestName').textContent=d.name;
    document.getElementById('bvDestCountry').textContent=d.country;

    /* Meta */
    var metaEl=document.getElementById('bvDestHeroMeta');
    d.meta.forEach(function(m){
      var s=document.createElement('span');
      s.className='bvDest_meta';
      s.innerHTML=m.i+' '+m.t;
      metaEl.appendChild(s);
    });

    /* Timeline */
    var tl=document.getElementById('bvDestTimeline');
    d.days.forEach(function(day,i){
      var div=document.createElement('div');
      div.className='bvDest_day';
      div.innerHTML='<div class="bvDest_dayNum"><div class="bvDest_dayBadge">'+(i+1)+'</div><div class="bvDest_dayLine"></div></div>'
        +'<div class="bvDest_dayContent"><p class="bvDest_dayTitle">'+day.t+'</p><p class="bvDest_dayDesc">'+day.d+'</p></div>';
      tl.appendChild(div);
    });

    /* Includes */
    var inc=document.getElementById('bvDestIncludes');
    d.includes.forEach(function(it){
      var li=document.createElement('li');
      li.innerHTML='<span class="bvDest_incIcon">'+it.i+'</span>'+it.t;
      inc.appendChild(li);
    });

    /* Places */
    var pl=document.getElementById('bvDestPlaces');
    d.places.forEach(function(p){
      var div=document.createElement('div');
      div.className='bvDest_place';
      div.innerHTML='<span class="bvDest_placeIcon">'+p.i+'</span><span class="bvDest_placeName">'+p.n+'</span>';
      pl.appendChild(div);
