<!-- [bluvia_stats] عداد أرقام متحرك -->
<section id="bvSt" dir="rtl">
  <div class="bvSt_wrap">
    <div class="bvSt_grid">

      <div class="bvSt_item bvReveal">
        <div class="bvSt_ico">
          <svg width="28" height="28" fill="none" stroke="#60A5FA" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/></svg>
        </div>
        <span class="bvSt_num" data-target="2500" data-suffix="+">0</span>
        <span class="bvSt_lbl">رحلة منجزة</span>
      </div>

      <div class="bvSt_div"></div>

      <div class="bvSt_item bvReveal" style="animation-delay:.1s">
        <div class="bvSt_ico">
          <svg width="28" height="28" fill="none" stroke="#60A5FA" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
        </div>
        <span class="bvSt_num" data-target="98" data-suffix="%">0</span>
        <span class="bvSt_lbl">رضا العملاء</span>
      </div>

      <div class="bvSt_div"></div>

      <div class="bvSt_item bvReveal" style="animation-delay:.2s">
        <div class="bvSt_ico">
          <svg width="28" height="28" fill="none" stroke="#60A5FA" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <span class="bvSt_num" data-target="30" data-suffix="+">0</span>
        <span class="bvSt_lbl">وجهة سياحية</span>
      </div>

      <div class="bvSt_div"></div>

      <div class="bvSt_item bvReveal" style="animation-delay:.3s">
        <div class="bvSt_ico">
          <svg width="28" height="28" fill="none" stroke="#60A5FA" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/></svg>
        </div>
        <span class="bvSt_num" data-target="8" data-suffix="+">0</span>
        <span class="bvSt_lbl">سنوات خبرة</span>
      </div>

    </div>
  </div>
</section>

<style>
#bvSt{position:relative!important;left:50%!important;right:50%!important;margin-left:-50vw!important;margin-right:-50vw!important;width:100vw!important;max-width:100vw!important;box-sizing:border-box!important;background:linear-gradient(135deg,#0d1a2e 0%,#0a1628 50%,#060e1f 100%);padding:70px 0;direction:rtl;overflow:hidden}
#bvSt::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 50%,rgba(59,130,246,.06) 0%,transparent 70%);pointer-events:none}
#bvSt *{box-sizing:border-box!important}
.bvSt_wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.bvSt_grid{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0}
.bvSt_item{flex:1;min-width:160px;text-align:center;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bvSt_ico{width:60px;height:60px;border-radius:16px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2)!important;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.bvSt_num{font-size:clamp(36px,5vw,52px);font-weight:900;color:#60A5FA!important;line-height:1;font-family:Cairo,sans-serif}
.bvSt_lbl{font-size:14px;color:rgba(255,255,255,.5);font-weight:600}
.bvSt_div{width:1px;height:70px;background:rgba(255,255,255,.07);flex-shrink:0}
@media(max-width:640px){.bvSt_div{display:none}.bvSt_item{min-width:50%}.bvSt_grid{row-gap:8px}}
</style>

<script>
(function(){
  function countUp(el){
    var target=parseInt(el.getAttribute("data-target")||"0");
    var suffix=el.getAttribute("data-suffix")||"";
    var dur=1800, start=null;
    function step(ts){
      if(!start) start=ts;
      var p=Math.min((ts-start)/dur,1);
      var ease=1-Math.pow(1-p,3);
      el.textContent=Math.floor(ease*target)+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var nums=document.querySelectorAll("#bvSt .bvSt_num");
  if(!nums.length) return;
  var done=false;
  var obs=new IntersectionObserver(function(entries){
    if(done) return;
    entries.forEach(function(e){
      if(e.isIntersecting){done=true;nums.forEach(countUp);obs.disconnect();}
    });
  },{threshold:.3});
  obs.observe(document.getElementById("bvSt"));
}());
</script>
