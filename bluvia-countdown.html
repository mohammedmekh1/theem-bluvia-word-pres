@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
#bvCd{
  position:relative!important;left:50%!important;right:50%!important;

  width:100vw!important;max-width:100vw!important;

  font-family:Cairo,sans-serif;
}
#bvCd *{box-sizing:border-box!important;font-family:Cairo,sans-serif!important}
.bvCd_wrap{
  max-width:1280px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
}
.bvCd_right{display:flex;align-items:center;gap:12px;flex:1;min-width:180px}
.bvCd_clock{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.25)!important}
.bvCd_label{font-size:12px;font-weight:700;color:#D4AF37;margin-bottom:3px;letter-spacing:.3px}
.bvCd_title{font-size:15px;font-weight:800;color:#fff}
.bvCd_center{display:flex;align-items:center;gap:6px;flex-shrink:0}
.bvCd_unit{text-align:center}
.bvCd_num{
  font-size:30px;font-weight:900;color:#fff;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12)!important;
  border-radius:10px;padding:5px 10px;
  min-width:56px;display:block;line-height:1.1;
  transition:transform .12s;
}
.bvCd_num.bvFlip{transform:scale(1.12)}
.bvCd_lbl{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;font-weight:600}
.bvCd_sep{font-size:26px;font-weight:900;color:#60A5FA;margin-bottom:14px;line-height:1;flex-shrink:0}
.bvCd_left{flex-shrink:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bvCd_btn{
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  gap:6px;padding:10px 22px!important;border-radius:50px!important;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8)!important;
  color:#fff!important;font-size:13px;font-weight:800;
  text-decoration:none!important;
  box-shadow:0 5px 18px rgba(59,130,246,.4);
  transition:all .3s;white-space:nowrap;line-height:1;
}
.bvCd_btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.6)!important;color:#fff!important}
.bvCd_btn svg{display:block!important;flex-shrink:0}
.bvCd_btn span{display:block;line-height:1}
.bvCd_wa{
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  gap:6px;padding:9px 18px!important;border-radius:50px!important;
  background:rgba(37,211,102,.12)!important;
  border:1px solid rgba(37,211,102,.35)!important;
  color:#fff!important;font-size:12px;font-weight:700;
  text-decoration:none!important;
  transition:all .3s;white-space:nowrap;line-height:1;
}
.bvCd_wa:hover{background:rgba(37,211,102,.22)!important;color:#fff!important}
.bvCd_wa svg{display:block!important;flex-shrink:0}
.bvCd_wa span{display:block;line-height:1}
@media(max-width:900px){
  .bvCd_wrap{justify-content:center;text-align:center}
  .bvCd_right{justify-content:center;flex-basis:100%}
  .bvCd_left{flex-basis:100%;align-items:center}
}
@media(max-width:480px){.bvCd_num{font-size:22px;min-width:44px}.bvCd_sep{font-size:18px}}
</style>

<script>
var bvCdEnd = new Date('2026-07-07T00:00:00').getTime();

function bvCdTick() {
  var dEl = document.getElementById('bvCdD');
  var hEl = document.getElementById('bvCdH');
  var mEl = document.getElementById('bvCdM');
  var sEl = document.getElementById('bvCdS');
  if (!dEl) return;

  var diff = bvCdEnd - Date.now();
  if (diff < 0) diff = 0;

  var d = Math.floor(diff / 86400000);
  var h = Math.floor((diff % 86400000) / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);

  function p(n){ return n < 10 ? '0'+n : ''+n; }
  function set(el, v){
    if (el.textContent !== v){
      el.textContent = v;
      el.classList.remove('bvFlip');
      void el.offsetWidth;
      el.classList.add('bvFlip');
      setTimeout(function(){ el.classList.remove('bvFlip'); }, 130);
    }
  }

  set(dEl, p(d));
  set(hEl, p(h));
  set(mEl, p(m));
  set(sEl, p(s));
}

bvCdTick();
setInterval(bvCdTick, 1000);
</script>
