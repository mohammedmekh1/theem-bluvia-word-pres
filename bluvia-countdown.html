.bvCd_btn:hover{transform:translateY(-2px) scale(1.04);color:#fff!important;box-shadow:0 10px 28px rgba(59,130,246,.55)!important}
.bvCd_btn svg{display:block!important;flex-shrink:0}
.bvCd_btn span{display:block;line-height:1}
.bvCd_wa{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:6px;padding:10px 20px!important;border-radius:50px!important;background:rgba(37,211,102,.12)!important;border:1px solid rgba(37,211,102,.35)!important;color:#fff!important;font-size:12px;font-weight:700;text-decoration:none!important;transition:all .3s;white-space:nowrap;line-height:1}
.bvCd_wa:hover{background:rgba(37,211,102,.22)!important;color:#fff!important}
.bvCd_wa svg{display:block!important;flex-shrink:0}
.bvCd_wa span{display:block;line-height:1}
@keyframes bvCdShine{0%,100%{opacity:0}50%{opacity:1}}
@media(max-width:900px){.bvCd_wrap{justify-content:center;text-align:center}.bvCd_right{justify-content:center;flex-basis:100%}.bvCd_left{flex-basis:100%;align-items:center}}

<script>
(function(){
  var END_DATE = "2026-07-07T00:00:00";
  var dEl = document.getElementById("bvCdD");
  var hEl = document.getElementById("bvCdH");
  var mEl = document.getElementById("bvCdM");
  var sEl = document.getElementById("bvCdS");
  if (!dEl) return;
  function pad(n){ return String(Math.max(0,n)).padStart(2,"0"); }
  function flip(el, val){
    var cur = el.textContent;
    if (cur === val) return;
    el.classList.add("flip");
    setTimeout(function(){ el.textContent = val; el.classList.remove("flip"); }, 75);
  }
  function tick(){
    var now = new Date(), end = new Date(END_DATE);
    var diff = Math.max(0, end - now);
    flip(dEl, pad(Math.floor(diff / 86400000)));
    flip(hEl, pad(Math.floor((diff % 86400000) / 3600000)));
    flip(mEl, pad(Math.floor((diff % 3600000) / 60000)));
    flip(sEl, pad(Math.floor((diff % 60000) / 1000)));
    if (diff === 0){ document.getElementById("bvCdTitle").textContent = "انتهى العرض — تابعونا للعروض القادمة"; clearInterval(timer); }
  }
  tick();
  var timer = setInterval(tick, 1000);
}());
</script>
